<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Registration</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        .debug { color: blue; background: #f0f0f0; padding: 10px; margin: 10px 0; }
        button { padding: 10px 15px; margin: 5px; }
        input, select { padding: 8px; margin: 5px; width: 200px; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Debug Registration Issue</h1>
    
    <div class="test-section">
        <h2>Test Registration (Debug Mode)</h2>
        <input type="text" id="firstName" placeholder="First Name" value="Debug">
        <input type="text" id="lastName" placeholder="Last Name" value="User">
        <input type="text" id="middleName" placeholder="Middle Name" value="">
        <input type="email" id="email" placeholder="Email" value="debug.user@cvsu.edu.ph">
        <input type="password" id="password" placeholder="Password" value="DebugPassword123!">
        <input type="password" id="confirmPassword" placeholder="Confirm Password" value="DebugPassword123!">
        <select id="department">
            <option value="">Select Department</option>
            <option value="Department of Information Technology">Department of Information Technology</option>
            <option value="Department of Industrial Engineering and Technology">Department of Industrial Engineering and Technology</option>
            <option value="Department of Computer, Electronics, and Electrical Engineering">Department of Computer, Electronics, and Electrical Engineering</option>
            <option value="Department of Civil Engineering and Architecture">Department of Civil Engineering and Architecture</option>
            <option value="Department of Agriculture and Food Engineering">Department of Agriculture and Food Engineering</option>
        </select>
        <br><br>
        <button onclick="testLocalhost()">Test Localhost</button>
        <button onclick="testDeployed()">Test Deployed (Render)</button>
        <div id="debug-info"></div>
        <div id="registration-result"></div>
    </div>

    <script>
        const LOCAL_API = 'http://localhost:8000/api';
        const DEPLOYED_API = 'https://eventmanagement-backend-z7ek.onrender.com/api';
        
        function getFormData() {
            return {
                first_name: document.getElementById('firstName').value,
                last_name: document.getElementById('lastName').value,
                middle_initial: document.getElementById('middleName').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                password_confirmation: document.getElementById('confirmPassword').value,
                department: document.getElementById('department').value
            };
        }
        
        function showDebugInfo(apiUrl, formData) {
            const debugDiv = document.getElementById('debug-info');
            debugDiv.innerHTML = `
                <div class="debug">
                    <h3>Debug Information</h3>
                    <p><strong>API URL:</strong> ${apiUrl}/register</p>
                    <p><strong>Request Data:</strong></p>
                    <pre>${JSON.stringify(formData, null, 2)}</pre>
                </div>
            `;
        }
        
        async function testRegistration(apiUrl, label) {
            const resultDiv = document.getElementById('registration-result');
            const formData = getFormData();
            
            if (!formData.department) {
                resultDiv.innerHTML = '<p class="error">Please select a department</p>';
                return;
            }
            
            showDebugInfo(apiUrl, formData);
            
            try {
                resultDiv.innerHTML = `<p>Testing ${label}...</p>`;
                
                const response = await fetch(`${apiUrl}/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ ${label} Registration Successful!</h3>
                            <p><strong>Status:</strong> ${response.status}</p>
                            <p><strong>Message:</strong> ${result.message}</p>
                            <p><strong>Email:</strong> ${result.email}</p>
                            <p><strong>Note:</strong> ${result.message_note || 'N/A'}</p>
                        </div>
                    `;
                } else {
                    let errorDetails = `<p><strong>Status:</strong> ${response.status}</p>`;
                    errorDetails += `<p><strong>Message:</strong> ${result.message || 'No message'}</p>`;
                    
                    if (result.errors) {
                        errorDetails += '<p><strong>Validation Errors:</strong></p><ul>';
                        Object.entries(result.errors).forEach(([field, messages]) => {
                            errorDetails += `<li><strong>${field}:</strong> ${messages.join(', ')}</li>`;
                        });
                        errorDetails += '</ul>';
                    }
                    
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ ${label} Registration Failed</h3>
                            ${errorDetails}
                            <p><strong>Full Response:</strong></p>
                            <pre>${JSON.stringify(result, null, 2)}</pre>
                        </div>
                    `;
                }
                
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ ${label} Network Error</h3>
                        <p><strong>Error:</strong> ${error.message}</p>
                        <p>This could be a CORS issue, network connectivity problem, or server error.</p>
                    </div>
                `;
            }
        }
        
        function testLocalhost() {
            testRegistration(LOCAL_API, 'Localhost');
        }
        
        function testDeployed() {
            testRegistration(DEPLOYED_API, 'Deployed');
        }
    </script>
</body>
</html>
